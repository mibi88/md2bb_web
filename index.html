<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf8"/>
        <title>Mibi&rsquo;s Website &mdash; md2bb.pl</title>
        <link href="/icon.png" rel="icon" type="image/png">
        <link rel="stylesheet" type="text/css" href="/styles.css">
        <script type="text/javascript" src="/index.js"></script>
    </head>
    <header class="bar" id="bar">
        <a href="/index.html" style="all: inherit">
            <img class="logo" width=60px height=60px src="/icon.png"/>
            <h1 id="title">Mibi&rsquo;s Website</h1>
        </a>
        <button onclick="topFunction();" id="up_button" title="Go to top">
            ^
        </button>
    </header>
    <body onload="easterEgg();">
        <div class="group">
            <h1>md2bb.pl</h1>
            <div id="article-list">
                
<script src="webperl.js"></script>

<script>
function sync_in() {
    document.getElementById("in").style.height = document.getElementById("out").style.height;
}
function sync_out() {
    document.getElementById("out").style.height = document.getElementById("in").style.height;
}

function convert() {
    if(typeof script === "undefined") return;
    var status = document.getElementById("status");
    status.style.display = "block";
    status.innerHTML = "Converting&hellip; Please wait&hellip;";
    FS.writeFile("text.md", document.getElementById("in").value);

    console.log(script);
    document.getElementById("out").value = Perl.eval(script);
    status.innerHTML = "";
    status.style.display = "none";
}

function settings() {
    var settings = document.getElementById("settings");

    if(settings.style.display == "none"){
        settings.style.display = "flex";
    }else{
        settings.style.display = "none";
    }
}
</script>
<style>
th, td {
    padding-left: 1em;
    padding-right: 1em;
}
textarea {
    background-color: var(--group-bg);
    color: var(--text-color);
    border: 1px var(--shadow) solid;
}
button {
    border: 1px var(--shadow) solid;
    background-color: var(--group-bg);
    color: var(--text-color);
}
</style>

<div id="settings" style="display: none; background-color: color-mix(var(--page-bg), #0000 40%); align-items: center; justify-content: center; width: 100vw; height: 100vh; position: absolute; top: 0px; left: 0px; z-index: 100">
    <form id="settingsform" style="display: flex; width: 50vw; height: 50vh; padding: 5em; align-items: center; justify-content: center; flex-direction: column" class="group">
        <p>Coming soon&hellip;</p>
        <input type="submit" value="Apply">
    </form>
</div>
<table style="width: 100%">
    <tr>
        <th>Markdown</th>
        <th>BBCode</th>
    </tr>
    <tr>
        <td>
            <textarea autofocus id="in" autocorrect="on" style="resize: vertical; width: 100%; height: 50vh;"># Some Markdown</textarea>
        </td>
        <td>
            <textarea id="out" autocorrect="off" readonly style="resize: vertical; width: 100%; height: 50vh;"></textarea>
        </td>
    </tr>
    <tr>
        <td colspan="2" style="padding-right: 0.5em">
            <div style="display: flex; flex-direction: row; width: 100%; margin: 0px; padding: 0px">
                <button style="flex-grow: 1; font-family: monospace" onclick="convert();">Convert!</button>
                <button style="" onclick="settings();">&#9881;</button>
            </div>
        </td>
    </tr>
    <tr>
        <td id="status" colspan="2" style="padding-right: 0.5em">
            Please wait&hellip;
        </td>
    </tr>
</table>

<script>
new ResizeObserver(sync_out).observe(document.getElementById("in"));
new ResizeObserver(sync_in).observe(document.getElementById("out"));

document.getElementById("settingsform").addEventListener("submit",
    function (event) {
    event.preventDefault();

    settings();
});

var status = document.getElementById("status");

status.innerHTML = "Loading Webperl&hellip; Please wait&hellip;";
Perl.init(function () {
    var status = document.getElementById("status");
    status.innerHTML = "Loading md2bb.pl&hellip; Please wait&hellip;";
    FS.writeFile("text.md", document.getElementById("in").value);

    var xml = new XMLHttpRequest();
    xml.onload = function (e) {
        if(xml.status == 200){
            var status = document.getElementById("status");
            status.innerHTML = "Converting&hellip; Please wait&hellip;";
            script = xml.responseText;
            script = "@ARGV = ('text.md');\nmy $text = '';\nclose STDOUT;\n" +
                     "open STDOUT, '>', \\$text;\n" + script +
                     "\nreturn $text;";
            console.log(script);
            Perl.start([]);
            document.getElementById("out").value = Perl.eval(script);
            status.innerHTML = "";
            status.style.display = "none";
        }
    };
    xml.open("GET", "md2bb.pl/md2bb.pl", true);
    xml.send();
});
</script>
            </div>
        </div>
    </body>
    <footer>
        (C) 2024&ndash;2026 Mibi88
    </footer>
</html>
